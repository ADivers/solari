name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the site
        run: python tools/build_pages.py

      - name: Check links
        run: python tools/check_links.py _site

      - name: Install browser for tests
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Browser smoke tests (desktop + phone)
        run: python tests/smoke.py _site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lhci-report
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
