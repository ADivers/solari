<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLARI — the whole page is a board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An experiment: a website that is nothing but one split-flap departures board.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%272%27 fill=%27%231f1f1d%27/%3E%3Crect y=%277.5%27 width=%2716%27 height=%271%27 fill=%27%23050505%27/%3E%3Crect x=%275%27 y=%273%27 width=%276%27 height=%2710%27 fill=%27%23f5c400%27/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/BarlowCondensed-SemiBold-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="canonical" href="https://adivers.github.io/solari/board/">
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;background:var(--housing);min-height:100%}
  body{overflow-x:hidden}
  canvas{display:block;touch-action:manipulation}
  /* Real, accessible copy of whatever the board says. Visually hidden; focusable links surface on focus. */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sr a:focus{position:fixed;left:8px;top:8px;width:auto;height:auto;clip:auto;z-index:2;padding:6px 10px;background:var(--solari-yellow);color:var(--on-yellow);font:600 14px/20px system-ui,sans-serif;outline:2px solid var(--flap-ink)}
  #page a:focus{position:fixed}
</style>
</head>
<body>
<nav class="sr" aria-label="Board pages" id="nav"></nav>
<main class="sr" id="page" aria-live="polite"></main>
<canvas id="board" aria-hidden="true"></canvas>
<script src="../engine/solari-board.js"></script>
<script>
(function () {
  "use strict";
  var B = window.SolariBoard, pad = B.pad, padL = B.padL;

  var TIMETABLE = [
    ["09:42", "GENEVA", "LAUSANNE", "4"], ["09:55", "MILANO", "BRIG", "11"], ["10:08", "ZURICH HB", "BERN", "7"],
    ["10:20", "PARIS", "DIJON", "2"], ["10:31", "VENEZIA", "VERONA", "9"], ["10:47", "MUNCHEN", "LINDAU", "5"],
    ["11:02", "WIEN", "SALZBURG", "3"], ["11:15", "BARCELONA", "LYON", "8"], ["11:28", "TORINO", "MODANE", "6"],
    ["11:40", "BASEL SBB", "OLTEN", "12"], ["11:56", "FIRENZE", "BOLOGNA", "1"], ["12:10", "LJUBLJANA", "VILLACH", "10"]
  ];
  var REMARKS = [["ON TIME", "w"], ["ON TIME", "w"], ["DELAY 5", "y"], ["ON TIME", "w"], ["BOARDING", "Y"], ["ON TIME", "w"], ["DELAY 10", "y"], ["CANCELLED", "r"], ["ON TIME", "w"]];
  var NAV = [["HOME", "#home"], ["DEPARTURES", "#departures"], ["ABOUT", "#about"], ["CONTACT", "#contact"]];
  var tick = 0, route = "home";

  // Each page writes onto a Grid g: g.para(text, colour), g.line(text, colour, link), g.blank()
  var PAGES = {
    home: { title: "Home", draw: function (g) {
      g.blank(); g.line("EVERY MESSAGE,", "y"); g.line("ONE FLAP AT A TIME.", "y"); g.blank();
      g.para("THIS WHOLE PAGE IS ONE SPLIT-FLAP BOARD. THERE IS NO OTHER TEXT, NO IMAGES AND NO SCROLLING CONTENT - ONLY FLAPS.");
      g.blank(); g.para("PICK A DESTINATION AND THE BOARD WILL FLIP TO IT."); g.blank();
      g.line("> DEPARTURES", "y", "#departures"); g.line("> HOW IT WORKS", "y", "#about"); g.line("> CONTACT", "y", "#contact");
      g.line("> THE BOARD BLOG", "y", "../blog/");
    } },
    departures: { title: "Departures", draw: function (g, cols, fit) {
      var dest = cols >= 40 ? 10 : Math.max(6, cols - 5 - 1 - 1 - 2 - (cols >= 30 ? 9 : 0) - 1);
      var showRem = cols >= 30, showVia = cols >= 48;
      function base(t, d, v, p) { return pad(t, 5) + " " + pad(d, dest) + " " + (showVia ? pad(v, 9) + " " : "") + padL(p, 2); }
      g.blank(); g.line("DEPARTURES  PARTENZE", "y"); g.blank();
      var hr = g.blank(), x = g.put(hr, 0, base("TIME", "DESTINATION", "VIA", "PL"), "m");
      if (showRem) g.put(hr, x + 1, "REMARKS", "m");
      var n = Math.max(4, Math.min(TIMETABLE.length, fit - 10));
      for (var i = 0; i < n; i++) {
        var t = TIMETABLE[(tick + i) % TIMETABLE.length];
        var rem = i === 0 ? ["BOARDING", "Y"] : REMARKS[(tick * 2 + i * 3) % REMARKS.length];
        var r = g.blank(), x2 = g.put(r, 0, base(t[0], t[1], t[2], t[3]), "w");
        if (showRem) g.put(r, x2 + 1, pad(rem[0], 9), rem[1]);
      }
      g.blank(); g.line("> HOME", "y", "#home");
    }, text: function () { return ["DEPARTURES"].concat(TIMETABLE.slice(0, 8).map(function (t) { return t[0] + " " + t[1] + " via " + t[2] + ", platform " + t[3]; })); } },
    about: { title: "How it works", draw: function (g) {
      g.blank(); g.line("HOW IT WORKS", "y"); g.blank();
      g.para("EVERY CELL IS A CARD ON A DRUM. A CELL ONLY EVER FLIPS FORWARD - SPACE, A TO Z, 0 TO 9, PUNCTUATION - UNTIL IT LANDS.");
      g.blank(); g.para("WHEN YOU CHANGE PAGE, ONLY THE CELLS WHOSE LETTERS CHANGE WILL MOVE. THE WAVE RUNS LEFT TO RIGHT, TOP TO BOTTOM.");
      g.blank(); g.para("THE WHOLE BOARD IS ONE CANVAS, REDRAWN ONLY WHERE A FLAP IS MOVING. A SCREEN READER GETS THE SAME WORDS AS REAL TEXT.");
      g.blank(); g.line("> HOME", "y", "#home"); g.line("> DEPARTURES", "y", "#departures");
    } },
    contact: { title: "Contact", draw: function (g) {
      g.blank(); g.line("CONTACT", "y"); g.blank();
      g.line("INFORMATION DESK", "m"); g.para("PLATFORM 1, MAIN CONCOURSE"); g.blank();
      g.line("OPEN", "m"); g.line("DAILY 05:30 - 23:45"); g.blank();
      g.line("SOURCE", "m"); g.line("GITHUB.COM/ADIVERS/SOLARI", "y", "https://github.com/ADivers/solari"); g.blank();
      g.line("> HOME", "y", "#home");
    } }
  };

  function two(n) { return (n < 10 ? "0" : "") + n; }
  function compose(cols, fit) {
    var g = B.Grid(cols);
    g.blank(); g.put(0, 0, "SOLARI", "Y");
    var navW = NAV.reduce(function (a, n) { return a + n[0].length + 1; }, 0) - 1, row = 0, x;
    if (cols - 7 >= navW) x = cols - navW; else { row = g.blank(); x = 0; }
    NAV.forEach(function (n) {
      if (x + n[0].length > cols) { row = g.blank(); x = 0; }
      g.put(row, x, n[0], n[1] === "#" + route ? "y" : "m", n[1]); x += n[0].length + 1;
    });
    PAGES[route].draw(g, cols, fit);
    var last = Math.max(fit, g.rows.length + 2) - 1, now = new Date(), t = TIMETABLE[tick % TIMETABLE.length];
    g.put(last, 0, two(now.getHours()) + ":" + two(now.getMinutes()), "y");
    var next = "NEXT " + t[0] + " " + t[1];
    if (cols - 6 > next.length) g.put(last, cols - next.length, next, "m");
    return g.out();
  }

  function writeText() {
    var nav = document.getElementById("nav"), page = document.getElementById("page");
    nav.innerHTML = ""; page.innerHTML = "";
    NAV.forEach(function (n) {
      var a = document.createElement("a"); a.href = n[1]; a.textContent = n[0].charAt(0) + n[0].slice(1).toLowerCase();
      if (n[1] === "#" + route) a.setAttribute("aria-current", "page"); nav.appendChild(a);
    });
    var h = document.createElement("h1"); h.textContent = "SOLARI - " + PAGES[route].title; page.appendChild(h);
    var g = B.Grid(60); PAGES[route].draw(g, 60, 30);
    var text = PAGES[route].text ? PAGES[route].text() : g.rows.map(function (r) { return r.map(function (c) { return c[0]; }).join("").trim(); });
    var links = {}; g.links.forEach(function (l) { links[l.row] = l.go; });
    text.forEach(function (t, i) {
      if (!t) return;
      var el;
      if (links[i]) { el = document.createElement("a"); el.href = links[i]; el.textContent = t.replace(/^> /, ""); }
      else { el = document.createElement("p"); el.textContent = t; }
      page.appendChild(el);
    });
  }

  var board = B(document.getElementById("board"), {
    compose: compose,
    onLink: function (l) { if (/^https?:/.test(l.go)) window.open(l.go, "_blank", "noopener"); else location.href = l.go; }
  });
  function go() {
    var r = (location.hash || "#home").slice(1);
    route = PAGES[r] ? r : "home";
    document.title = "SOLARI - " + PAGES[route].title;
    writeText(); board.refresh(true);
  }
  window.addEventListener("hashchange", go);
  setInterval(function () { tick++; board.refresh(true); }, 12000);
  var lastMin = new Date().getMinutes();
  setInterval(function () { var m = new Date().getMinutes(); if (m !== lastMin) { lastMin = m; board.refresh(true); } }, 1000);

  var ready = document.fonts && document.fonts.load ? document.fonts.load('600 40px "Barlow Condensed"') : Promise.resolve();
  Promise.race([ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
    var r = (location.hash || "#home").slice(1); route = PAGES[r] ? r : "home";
    board.refresh(false); board.blank(); go();
  });
  window.__board = board;
})();
</script>
</body>
</html>
