<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLARI Journal — a blog on a departures board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A blog that is a split-flap departures board. Posts are trains; reading one flips the board through it a screen at a time.">
<link rel="alternate" type="application/rss+xml" title="SOLARI Journal" href="feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%272%27 fill=%27%231f1f1d%27/%3E%3Crect y=%277.5%27 width=%2716%27 height=%271%27 fill=%27%23050505%27/%3E%3Crect x=%275%27 y=%273%27 width=%276%27 height=%2710%27 fill=%27%23f5c400%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=block">
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0;background:var(--housing);min-height:100%}
  body{overflow-x:hidden}
  canvas{display:block;touch-action:pan-y}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sr a:focus,.sr button:focus{position:fixed;left:8px;top:8px;width:auto;height:auto;clip:auto;z-index:2;padding:6px 10px;background:var(--solari-yellow);color:var(--on-yellow);font:600 14px/20px system-ui,sans-serif;outline:2px solid var(--flap-ink);border:0}
  noscript div{max-width:640px;margin:40px auto;padding:0 24px;color:var(--flap-ink);font:16px/26px system-ui,sans-serif}
  noscript a{color:var(--solari-yellow)}
</style>
</head>
<body>
<nav class="sr" aria-label="Journal" id="nav"></nav>
<main class="sr" id="page" aria-live="polite"></main>
<canvas id="board" aria-hidden="true"></canvas>
<noscript><div><p>This blog is drawn on a split-flap board, which needs JavaScript. Every post also has a plain text version — see the <a href="feed.xml">RSS feed</a> for links.</p></div></noscript>
<script src="../engine/solari-board.js"></script>
<script>
(function () {
  "use strict";
  var B = window.SolariBoard, pad = B.pad, padL = B.padL, clean = B.clean, wrap = B.wrap;
  var MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  var posts = [], bySlug = {}, route = { name: "index" }, auto = false, autoTimer = 0;
  var READ_KEY = "solari-journal-read";

  /* ------------------------------------------------------------ read state */
  function readSet() { try { return JSON.parse(localStorage.getItem(READ_KEY) || "[]"); } catch (e) { return []; } }
  function isRead(slug) { return readSet().indexOf(slug) >= 0; }
  function markRead(slug) { try { var s = readSet(); if (s.indexOf(slug) < 0) { s.push(slug); localStorage.setItem(READ_KEY, JSON.stringify(s)); } } catch (e) {} }

  /* ------------------------------------------------------------ helpers */
  function dd(d) { var p = d.split("-"); return padL(String(+p[2]), 2) + " " + MONTHS[+p[1] - 1]; }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function live() { return posts.filter(function (p) { return p.status !== "arriving"; }); }
  function arriving() { return posts.filter(function (p) { return p.status === "arriving"; }).reverse(); }

  // Markdown subset -> board lines [{t, c, kind}] at a given width.
  function layoutPost(post, cols) {
    var lines = [], para = [], list = false;
    function blank() { if (lines.length && lines[lines.length - 1].t !== "") lines.push({ t: "", c: "w" }); }
    function push(text, c, indent, kind) {
      wrap(clean(text).replace(/ +/g, " ").trim(), cols, indent).forEach(function (l, i) { lines.push({ t: l, c: c, kind: i === 0 ? kind : "cont" }); });
    }
    function strip(s) { return s.replace(/`([^`]+)`/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1"); }
    function flush() { if (para.length) { blank(); push(strip(para.join(" ")), "w", "", "p"); para = []; } }
    post.body.split("\n").forEach(function (raw) {
      var s = raw.trim();
      if (!s) { flush(); list = false; return; }
      if (/^#{2,3} /.test(s)) { flush(); blank(); push(strip(s.replace(/^#+ /, "")), "y", "", "h"); return; }
      if (/^> /.test(s)) { flush(); blank(); push('"' + strip(s.slice(2)) + '"', "m", " ", "q"); return; }
      if (/^- /.test(s)) { flush(); if (!list) blank(); list = true; push("- " + strip(s.slice(2)), "w", "  ", "li"); return; }
      para.push(s);
    });
    flush();
    return lines;
  }
  // Cut lines into pages of `size` rows; never start a page with a blank, never strand a heading at the bottom.
  function paginate(lines, size) {
    var pages = [], cur = [];
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!cur.length && l.t === "") continue;
      var headingAtEnd = l.kind === "h" && cur.length >= size - 2;
      if (cur.length >= size || headingAtEnd) { pages.push(cur); cur = []; if (l.t === "") continue; }
      cur.push(l);
    }
    if (cur.length) pages.push(cur);
    return pages.length ? pages : [[]];
  }

  /* ------------------------------------------------------------ compose */
  var NAV = [["POSTS", "#/"], ["ABOUT", "#/about"], ["RSS", "feed.xml"]];
  function header(g, cols, active) {
    g.blank();
    var x = g.put(0, 0, "SOLARI", "Y");
    if (cols >= 30) g.put(0, x + 1, "JOURNAL", "w");
    var navW = NAV.reduce(function (a, n) { return a + n[0].length + 1; }, 0) - 1, row = 0, nx;
    var brandW = cols >= 30 ? 14 : 6;
    if (cols - brandW - 1 >= navW) nx = cols - navW; else { row = g.blank(); nx = 0; }
    NAV.forEach(function (n) { g.put(row, nx, n[0], n[1] === active ? "y" : "m", n[1]); nx += n[0].length + 1; });
    return g.rows.length;
  }
  function clock(g, row) { var now = new Date(); g.put(row, 0, two(now.getHours()) + ":" + two(now.getMinutes()), "y"); }

  function composeIndex(g, cols, fit) {
    header(g, cols, "#/");
    g.blank();
    var showMin = cols >= 30, statusW = 4, minW = showMin ? 3 : 0;
    var titleW = cols - 6 - 1 - (showMin ? minW + 1 : 0) - statusW - 1;
    function row(date, title, min, status, sc, go, tc) {
      var r = g.blank(), x = g.put(r, 0, pad(date, 6), "w");
      g.put(r, x + 1, pad(title, titleW), tc || "w");
      if (showMin) g.put(r, cols - statusW - 1 - minW, padL(min, minW), "w");
      g.put(r, cols - statusW, pad(status, statusW), sc);
      if (go) g.links.push({ row: r, c0: 0, c1: cols - 1, go: go });
    }
    var dr = g.line("DEPARTURES", "y");
    if (cols >= 30) g.put(dr, cols - 9, "PARTENZE", "m");
    var L = live(), A = arriving();
    // Two-line entries whenever any title would be cut off at this width.
    var narrow = cols < 30 || L.concat(A).some(function (p) { return clean(p.title).length > titleW; });
    if (!narrow) {
      var hr = g.blank(), x = g.put(hr, 0, "DATE  ", "m"); g.put(hr, x + 1, "TITLE", "m");
      if (showMin) g.put(hr, cols - statusW - 1 - minW, "MIN", "m");
    }
    function entry(date, title, min, status, sc, go, tc) {
      if (!narrow) return row(date, title, min, status, sc, go, tc);
      var r0 = g.blank(); g.put(r0, 0, date + (min ? "  " + min + " MIN" : ""), "w"); g.put(r0, cols - statusW, pad(status, statusW), sc);
      var tl = wrap(title, cols).slice(0, 2), r1 = r0;
      tl.forEach(function (t) { r1 = g.line(t, tc || "w"); });
      if (go) for (var k = r0; k <= r1; k++) g.links.push({ row: k, c0: 0, c1: cols - 1, go: go });
    }
    L.forEach(function (p) {
      var read = isRead(p.slug);
      entry(dd(p.date), clean(p.title), String(p.minutes), read ? "READ" : "NEW", read ? "m" : "Y", "#/post/" + p.slug + "/1");
    });
    if (A.length) {
      g.blank(); g.line("ARRIVALS", "y");
      A.forEach(function (p) { entry(dd(p.date), clean(p.title), "", "DUE", "m", null, "m"); });
    }
    // Now boarding: the newest unread post, or the newest post.
    var nb = L.filter(function (p) { return !isRead(p.slug); })[0] || L[0];
    if (nb && g.rows.length + 6 < fit) {
      g.blank(); g.line(isRead(nb.slug) ? "LATEST" : "NOW BOARDING", "m");
      var avail = fit - g.rows.length - 4;
      var lines = wrap(clean(nb.summary).replace(/ +/g, " "), cols);
      lines.slice(0, Math.max(1, avail)).forEach(function (l) { g.line(l, "w"); });
      var cta = "> READ " + clean(nb.title);
      g.line(cta.length <= cols ? cta : "> READ IT NOW", "y", "#/post/" + nb.slug + "/1");
    }
    var last = Math.max(fit, g.rows.length + 2) - 1;
    clock(g, last);
    var tail = L.length + " POSTS";
    if (cols > 12 + tail.length) g.put(last, cols - tail.length, tail, "m");
  }

  function composePost(g, cols, fit) {
    var post = bySlug[route.slug];
    var hrows = header(g, cols, "");
    var body = fit - hrows - 1 - 3; // blank after header, blank + 2 footer rows
    var lines = layoutPost(post, cols);
    // Page 1 starts with the title block.
    var titleLines = wrap(clean(post.title), cols).map(function (t) { return { t: t, c: "y", kind: "t" }; });
    var meta = dd(post.date) + " " + post.date.slice(0, 4) + " - " + post.minutes + " MIN" + (post.tags[0] ? " - " + clean(post.tags[0]) : "");
    var first = titleLines.concat([{ t: clean(meta), c: "m" }, { t: "", c: "w" }]);
    var summary = wrap(clean(post.summary).replace(/ +/g, " "), cols).map(function (t) { return { t: t, c: "m", kind: "p" }; });
    var all = first.concat(summary, [{ t: "", c: "w" }], lines);
    var pages = paginate(all, Math.max(4, body));
    route.pages = pages.length;
    var n = Math.min(Math.max(1, route.page), pages.length);
    route.page = n;
    g.blank();
    if (n > 1) { /* continuation marker sits in the header gap */ g.put(g.rows.length - 1, 0, pad(clean(post.title), Math.max(0, cols - 9)).trim().slice(0, cols - 9) + " CONT.", "m"); }
    route.words = 0;
    pages[n - 1].forEach(function (l) { var r = g.blank(); g.put(r, 0, l.t, l.c); route.words += (l.t.match(/[A-Z0-9']+/g) || []).length; });
    var last = Math.max(fit, g.rows.length + 3) - 1;
    // footer row 1: ALL POSTS · AUTO · TEXT
    var f1 = last - 1;
    g.put(f1, 0, "< ALL POSTS", "m", "#/");
    var autoT = auto ? "AUTO ON" : "AUTO";
    var textT = "TEXT";
    g.put(f1, cols - textT.length, textT, "m", "posts/" + post.slug + "/");
    if (cols >= 24) g.put(f1, Math.max(12, Math.floor((cols - autoT.length) / 2)), autoT, auto ? "y" : "m", "auto");
    // footer row 2: < PREV   n/N   NEXT >
    if (n > 1) g.put(last, 0, "< PREV", "y", "#/post/" + post.slug + "/" + (n - 1));
    var counter = n + "/" + pages.length;
    g.put(last, Math.floor((cols - counter.length) / 2), counter, "w");
    if (n < pages.length) g.put(last, cols - 6, "NEXT >", "y", "#/post/" + post.slug + "/" + (n + 1));
    else g.put(last, cols - 4, "END.", "m");
  }

  function composeAbout(g, cols, fit) {
    header(g, cols, "#/about");
    g.blank(); g.line("ABOUT THIS JOURNAL", "y"); g.blank();
    g.para("THIS BLOG IS A SPLIT-FLAP DEPARTURES BOARD. POSTS ARE TRAINS: THE DATE THEY LEFT, WHERE THEY GO, HOW LONG THE TRIP TAKES.");
    g.blank();
    g.para("OPEN ONE AND THE BOARD FLIPS THROUGH IT A SCREEN AT A TIME. ARROW KEYS OR A SWIPE TURN THE PAGE. AUTO READS IT TO YOU.");
    g.blank();
    g.para("EVERY POST ALSO HAS A TEXT VERSION, AND THERE IS AN RSS FEED.");
    g.blank();
    g.line("> ALL POSTS", "y", "#/");
    g.line("> HOW THE BOARD WORKS", "y", "#/post/one-canvas/1");
    g.line("> SOURCE ON GITHUB", "y", "https://github.com/ADivers/solari");
    clock(g, Math.max(fit, g.rows.length + 2) - 1);
  }

  function compose(cols, fit) {
    var g = B.Grid(cols);
    if (!posts.length) { g.blank(); g.blank(); g.line("LOADING...", "m"); return g.out(); }
    if (route.name === "post" && bySlug[route.slug]) composePost(g, cols, fit);
    else if (route.name === "about") composeAbout(g, cols, fit);
    else composeIndex(g, cols, fit);
    return g.out();
  }

  /* ------------------------------------------------------------ accessible text */
  function el(tag, text, attrs) { var e = document.createElement(tag); if (text != null) e.textContent = text; for (var k in attrs || {}) e.setAttribute(k, attrs[k]); return e; }
  function writeText() {
    var nav = document.getElementById("nav"), page = document.getElementById("page");
    nav.innerHTML = ""; page.innerHTML = "";
    nav.appendChild(el("a", "Posts", { href: "#/" })); nav.appendChild(el("a", "About", { href: "#/about" })); nav.appendChild(el("a", "RSS feed", { href: "feed.xml" }));
    if (route.name === "post" && bySlug[route.slug]) {
      var p = bySlug[route.slug];
      page.appendChild(el("h1", p.title));
      page.appendChild(el("p", p.date + ", " + p.minutes + " minute read. Page " + route.page + " of " + (route.pages || 1) + " on the board."));
      page.appendChild(el("a", "Read the text version", { href: "posts/" + p.slug + "/" }));
      page.appendChild(el("p", p.summary));
      p.body.split(/\n\s*\n/).forEach(function (b) {
        b = b.trim(); if (!b) return;
        if (/^#{2,3} /.test(b)) page.appendChild(el("h2", b.replace(/^#+ /, "")));
        else page.appendChild(el("p", b.replace(/^> /, "").replace(/^- /gm, "").replace(/\n/g, " ")));
      });
      if (route.page > 1) page.appendChild(el("a", "Previous page", { href: "#/post/" + p.slug + "/" + (route.page - 1) }));
      if (route.page < route.pages) page.appendChild(el("a", "Next page", { href: "#/post/" + p.slug + "/" + (route.page + 1) }));
      var b = el("button", auto ? "Stop auto-advance" : "Auto-advance pages"); b.onclick = toggleAuto; page.appendChild(b);
    } else if (route.name === "about") {
      page.appendChild(el("h1", "About the SOLARI Journal"));
      page.appendChild(el("p", "This blog is a split-flap departures board. Posts are trains; opening one flips the board through it a screen at a time. Every post also has a text version, and there is an RSS feed."));
    } else {
      page.appendChild(el("h1", "SOLARI Journal"));
      var ul = el("ul");
      live().forEach(function (p) {
        var li = el("li"); li.appendChild(el("a", p.title + (isRead(p.slug) ? "" : " (new)"), { href: "#/post/" + p.slug + "/1" }));
        li.appendChild(document.createTextNode(" — " + p.date + ", " + p.minutes + " min. "));
        li.appendChild(el("a", "Text version", { href: "posts/" + p.slug + "/" }));
        ul.appendChild(li);
      });
      page.appendChild(ul);
      if (arriving().length) {
        page.appendChild(el("h2", "Coming soon"));
        var ul2 = el("ul"); arriving().forEach(function (p) { ul2.appendChild(el("li", p.title + " — expected " + p.date)); }); page.appendChild(ul2);
      }
    }
  }

  /* ------------------------------------------------------------ routing + input */
  var board = B(document.getElementById("board"), { compose: compose, onLink: follow });
  function follow(l) {
    if (l.go === "auto") return toggleAuto();
    if (/^https?:/.test(l.go)) { window.open(l.go, "_blank", "noopener"); return; }
    if (l.go.charAt(0) === "#") { location.hash = l.go; return; }
    location.href = l.go;
  }
  function parseRoute() {
    var h = (location.hash || "#/").slice(1), m;
    if ((m = h.match(/^\/post\/([^\/]+)\/?(\d+)?/))) return { name: "post", slug: decodeURIComponent(m[1]), page: +(m[2] || 1) };
    if (h === "/about") return { name: "about" };
    return { name: "index" };
  }
  function go() {
    var prev = route;
    route = parseRoute();
    if (!(route.name === "post" && prev.name === "post" && prev.slug === route.slug)) stopAuto();
    if (route.name === "post" && bySlug[route.slug]) { markRead(route.slug); document.title = bySlug[route.slug].title + " — SOLARI Journal"; }
    else document.title = route.name === "about" ? "About — SOLARI Journal" : "SOLARI Journal — a blog on a departures board";
    board.refresh(true);
    writeText();
    if (auto) scheduleAuto();
  }
  function turn(d) {
    if (route.name !== "post") return;
    var n = route.page + d;
    if (n < 1 || n > route.pages) { if (d > 0) stopAuto(); return; }
    location.hash = "#/post/" + route.slug + "/" + n;
  }
  function stopAuto() { if (auto) { auto = false; clearTimeout(autoTimer); board.refresh(true); writeText(); } }
  function toggleAuto() {
    if (route.name !== "post") return;
    auto = !auto; clearTimeout(autoTimer);
    board.refresh(true); writeText();
    if (auto) scheduleAuto();
  }
  // AUTO: wait for the board to land, then hold for reading time (230 wpm, 4s minimum), then turn.
  function scheduleAuto() {
    clearTimeout(autoTimer);
    var hold = Math.max(4000, (route.words || 0) / 230 * 60000);
    (function wait() {
      if (!auto) return;
      if (!board.landed()) { autoTimer = setTimeout(wait, 250); return; }
      autoTimer = setTimeout(function () { if (auto) turn(1); }, hold);
    })();
  }
  window.addEventListener("hashchange", go);
  window.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (route.name !== "post") return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.shiftKey)) { e.preventDefault(); turn(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp" || (e.key === " " && e.shiftKey)) { e.preventDefault(); turn(-1); }
    else if (e.key === "Escape") location.hash = "#/";
    else if (e.key === "a" || e.key === "A") toggleAuto();
  });
  var tx = null, ty = null;
  window.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
  }, { passive: true });
  var lastMin = new Date().getMinutes();
  setInterval(function () { var m = new Date().getMinutes(); if (m !== lastMin) { lastMin = m; board.refresh(true); } }, 1000);

  var fontReady = document.fonts && document.fonts.load ? document.fonts.load('600 40px "Barlow Condensed"') : Promise.resolve();
  var data = fetch("posts.json", { cache: "no-cache" }).then(function (r) { return r.json(); });
  Promise.all([Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 1500); })]), data]).then(function (res) {
    posts = res[1].posts || [];
    posts.forEach(function (p) { bySlug[p.slug] = p; });
    route = parseRoute();
    board.refresh(false); board.blank();
    go();
  }).catch(function () {
    board.refresh(false);
  });
  window.__journal = { board: board, route: function () { return route; } };
})();
</script>
</body>
</html>
