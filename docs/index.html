<!doctype html>
<html>
<head><meta charset="utf-8"><title>SOLARI — a Solari board website theme</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%272%27 fill=%27%231f1f1d%27/%3E%3Crect y=%277.5%27 width=%2716%27 height=%271%27 fill=%27%23050505%27/%3E%3Crect x=%275%27 y=%273%27 width=%276%27 height=%2710%27 fill=%27%23f5c400%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<script>
(function(){
  var k='sl-theme',t;try{t=localStorage.getItem(k)}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  window.slToggleTheme=function(){
    var n=document.documentElement.getAttribute('data-theme')==='daylight'?'station':'daylight';
    document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(k,n)}catch(e){}
    document.querySelectorAll('iframe').forEach(function(f){try{f.contentDocument.documentElement.setAttribute('data-theme',n)}catch(e){}});
  };
})();
</script>

<meta name="description" content="SOLARI: a split-flap departures-board website theme and design system.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0}
  .pg{max-width:1104px;margin:0 auto;padding:0 var(--space-6)}
  .top{border-bottom:1px solid var(--line)}
  .hero{padding:var(--space-16) 0 var(--space-12);display:grid;gap:var(--space-8)}
  .eyebrow{color:var(--yellow-text)}
  .hero-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-8);align-items:end}
  .h1{margin:var(--space-3) 0 0;font-size:44px;line-height:48px;font-weight:700;letter-spacing:-.02em;max-width:18ch}
  .lede{margin:var(--space-4) 0 0;font-size:18px;line-height:28px;color:var(--ink-muted);max-width:56ch}
  .ctas{display:flex;gap:var(--space-3);flex-wrap:wrap}
  .sec{padding:var(--space-12) 0;border-top:1px solid var(--line)}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
  .h2{margin:var(--space-2) 0 0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.01em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-4)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4)}
  .stat{display:grid;gap:var(--space-2);justify-items:start}
  .band{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-8);align-items:center;background:var(--housing);border-radius:var(--radius-sm);padding:var(--space-8)}
  .band .h2{color:var(--flap-ink);margin:0 0 var(--space-2)}
  .band p{margin:0;color:var(--board-muted);max-width:48ch}
  .band .sl-btn--secondary{color:var(--flap-ink);border-color:var(--board-muted)}
  .foot{padding:var(--space-8) 0 var(--space-12);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;align-items:center}
  .small{font-size:14px;line-height:20px;color:var(--ink-muted)}
  .foot a{color:var(--ink-muted)}
  @media (max-width:760px){
    .hero{padding-top:var(--space-8)}
    .hero-copy,.band{grid-template-columns:1fr}
    .h1{font-size:34px;line-height:40px}
  }
</style>
</head>
<body class="sl-root">
<div id="root"></div>
<script>
  var S = window.Solari, h = React.createElement;
  var COLS = [
    { key: 'time', label: 'Time', width: 5 },
    { key: 'to', label: 'Destination', width: 10 },
    { key: 'via', label: 'Via', width: 8 },
    { key: 'plat', label: 'Plat', width: 2, align: 'right' },
    { key: 'status', label: 'Remarks', width: 8 }
  ];
  var TIMETABLE = [
    ['09:42', 'GENEVA', 'LAUSANNE', '4'],
    ['09:55', 'MILANO', 'BRIG', '11'],
    ['10:08', 'ZURICH HB', 'BERN', '7'],
    ['10:20', 'PARIS', 'DIJON', '2'],
    ['10:31', 'VENEZIA', 'VERONA', '9'],
    ['10:47', 'MUNCHEN', 'LINDAU', '5'],
    ['11:02', 'WIEN', 'SALZBURG', '3'],
    ['11:15', 'BARCELONA', 'LYON', '8']
  ];
  var REMARKS = [['ON TIME', null], ['ON TIME', null], ['BOARDING', 'yellow'], ['ON TIME', null], ['DELAY 5', 'yellow'], ['ON TIME', null]];
  function rowsAt(step) {
    var out = [];
    for (var i = 0; i < 5; i++) {
      var t = TIMETABLE[(step + i) % TIMETABLE.length];
      var r = i === 0 ? ['BOARDING', 'yellow'] : REMARKS[(step + i * 2) % REMARKS.length];
      out.push({ time: t[0], to: t[1], via: t[2], plat: t[3], status: { text: r[0], color: r[1] } });
    }
    return out;
  }
  function useNarrow() {
    var s = React.useState(window.innerWidth < 760), n = s[0], set = s[1];
    React.useEffect(function () {
      function f() { set(window.innerWidth < 760); }
      window.addEventListener('resize', f); return function () { window.removeEventListener('resize', f); };
    }, []);
    return n;
  }
  function Departures() {
    var s = React.useState(0), step = s[0], set = s[1];
    var narrow = useNarrow();
    React.useEffect(function () { var t = setInterval(function () { set(function (x) { return x + 1; }); }, 8000); return function () { clearInterval(t); }; }, []);
    var cols = narrow ? COLS.filter(function (c) { return c.key !== 'via'; }).map(function (c) { return c.key === 'to' ? Object.assign({}, c, { width: 9 }) : c; }) : COLS;
    return h(S.DepartureBoard, { title: 'Departures · Partenze', aside: h(S.StatusFlap, null, 'Live'), columns: cols, rows: rowsAt(step), rowCount: 5, size: narrow ? 16 : 'md' });
  }
  function Page() {
    var narrow = useNarrow();
    return h(React.Fragment, null,
      h('div', { className: 'top' }, h('div', { className: 'pg' }, h(S.NavBar, {
        brand: 'SOLARI',
        links: [{ label: 'Home', active: true, href: '#' }, { label: 'Timetable', href: '#departures' }, { label: 'Stations', href: '#stations' }, { label: 'About', href: '#about' }],
        action: h(S.Button, { size: 'sm', href: '#tickets' }, 'Buy tickets')
      }))),
      h('main', { className: 'pg' },
        h('section', { className: 'hero' },
          h(S.SplitFlap, { messages: ['NOW DEPARTING', 'ALL ABOARD', 'ON TIME', 'PLATFORM 9'], length: 13, fit: true, maxHeight: 120, color: 'yellow', align: 'left', interval: 4200 }),
          h('div', { className: 'hero-copy' },
            h('div', null,
              h('span', { className: 'sl-label eyebrow' }, 'Arrivals & departures'),
              h('h1', { className: 'h1' }, 'Every message, one flap at a time.'),
              h('p', { className: 'lede' }, 'A website that reads like the board above the concourse: big, plain, and updated in place. Times, places and platforms — nothing else competes for attention.')),
            h('div', { className: 'ctas' },
              h(S.Button, { arrow: true, href: '#tickets' }, 'Buy tickets'),
              h(S.Button, { variant: 'secondary', href: '#departures' }, 'View timetable')))),
        h('section', { className: 'sec', id: 'departures' },
          h('div', { className: 'sec-head' },
            h('div', null, h('span', { className: 'sl-label' }, 'Platforms 1–12'), h('h2', { className: 'h2' }, 'Next departures')),
            h(S.Clock, { caption: 'Station time', size: narrow ? 'sm' : 'md' })),
          h(Departures)),
        h('section', { className: 'sec', id: 'about' },
          h('div', { className: 'sec-head' }, h('div', null, h('span', { className: 'sl-label' }, 'Why it reads'), h('h2', { className: 'h2' }, 'Built like the real thing'))),
          h('div', { className: 'grid' },
            h(S.Panel, { label: '01 · Mechanism', title: 'Forward only' }, 'Each flap steps through its drum in order, so a change ripples across the board the way it does on the concourse.'),
            h(S.Panel, { label: '02 · Colour', title: 'Black, white, yellow' }, 'Black is the housing, white is information, yellow is the one thing you need to notice.'),
            h(S.Panel, { label: '03 · Content', title: 'Where, when, which platform' }, 'Boards carry short capitals. Everything else is real, selectable text in the system font.'))),
        h('section', { className: 'sec', id: 'stations' },
          h('div', { className: 'sec-head' }, h('div', null, h('span', { className: 'sl-label' }, 'Today'), h('h2', { className: 'h2' }, 'The network at a glance'))),
          h('div', { className: 'stats' },
            h('div', { className: 'stat' }, h('span', { className: 'sl-label' }, 'Trains today'), h(S.SplitFlap, { text: '1,284', size: 'md' })),
            h('div', { className: 'stat' }, h('span', { className: 'sl-label' }, 'On time'), h(S.SplitFlap, { text: '96%', size: 'md', color: 'yellow' })),
            h('div', { className: 'stat' }, h('span', { className: 'sl-label' }, 'Stations'), h(S.SplitFlap, { text: '212', size: 'md' })),
            h('div', { className: 'stat' }, h('span', { className: 'sl-label' }, 'Next arrival'), h(S.StatusFlap, { state: 'warn' }, 'Platform 9 · 2 min')))),
        h('section', { className: 'sec', id: 'tickets' },
          h('div', { className: 'band' },
            h('div', null, h('h2', { className: 'h2' }, 'Your seat is waiting.'), h('p', null, 'Book any route on the board in under a minute. Change or cancel up to the moment the flaps say boarding.')),
            h('div', { className: 'ctas' }, h(S.Button, { arrow: true }, 'Buy tickets'), h(S.Button, { variant: 'secondary' }, 'Season passes'))))),
      h('footer', { className: 'pg' }, h('div', { className: 'foot' },
        h(S.SplitFlap, { text: 'BUON VIAGGIO', size: 'sm' }),
        h('span', { className: 'small' }, '© 2026 SOLARI · ', h('a', { href: 'system/' }, 'Design system'), ' · ', h('a', { href: 'https://github.com/ADivers/solari' }, 'Source on GitHub')))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
<button type="button" class="sl-btn sl-btn--ghost sl-btn--sm sl-themebtn" onclick="slToggleTheme()">Theme</button>
<script>if(window.self!==window.top){var b=document.querySelector('.sl-themebtn');if(b)b.remove();}</script>
<style>.sl-themebtn{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--surface-100);border:1px solid var(--line-strong)}</style>
</body>
</html>
