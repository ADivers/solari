<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0}.wrap{padding:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.Button, { arrow: true }, 'Buy tickets'),
    h(S.Button, { variant: 'secondary' }, 'View timetable'),
    h(S.Button, { variant: 'ghost' }, 'Learn more'),
    h(S.Button, { size: 'sm' }, 'Sign in'),
    h(S.Button, { variant: 'secondary', disabled: true }, 'Sold out')
  ));
</script>
</body>
</html>
