<!doctype html>
<html>
<head><meta charset="utf-8"><title>Clock — preview</title>
<style>body{margin:0}.wrap{padding:24px;display:flex;gap:32px;flex-wrap:wrap;align-items:end}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.Clock, { caption: 'Local time', size: 'md' }),
    h(S.Clock, { caption: 'With seconds', size: 'sm', seconds: true, color: 'yellow' })
  ));
</script>
</body>
</html>
