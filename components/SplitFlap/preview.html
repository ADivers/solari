<!doctype html>
<html>
<head><meta charset="utf-8"><title>SplitFlap — preview</title>
<style>body{margin:0}.wrap{padding:24px;display:grid;gap:16px;justify-items:start}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.SplitFlap, { messages: ['NOW DEPARTING', 'ON TIME', 'PLATFORM 9'], length: 13, size: 'lg', interval: 3600 }),
    h(S.SplitFlap, { text: 'DELAYED 15', size: 'md', color: 'yellow' }),
    h(S.SplitFlap, { text: 'GENEVA', length: 10, size: 'sm' })
  ));
</script>
</body>
</html>
