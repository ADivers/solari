<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusFlap — preview</title>
<style>body{margin:0}.wrap{padding:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.StatusFlap, null, 'On time'),
    h(S.StatusFlap, { state: 'warn' }, 'Delayed'),
    h(S.StatusFlap, { state: 'alert' }, 'Cancelled'),
    h(S.StatusFlap, { state: 'off' }, 'Not in service')
  ));
</script>
</body>
</html>
