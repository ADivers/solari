<!doctype html>
<html>
<head><meta charset="utf-8"><title>NavBar — preview</title>
<style>body{margin:0}.wrap{padding:8px 24px}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(S.NavBar, {
    brand: 'SOLARI',
    links: [{ label: 'Home', active: true }, { label: 'Timetable' }, { label: 'Stations' }, { label: 'About' }],
    action: h(S.Button, { size: 'sm' }, 'Buy tickets')
  }));
</script>
</body>
</html>
