<!-- @dsCard group="Board" height=340 subtitle="Rows flip when their values change" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DepartureBoard — preview</title>
<style>body{margin:0}.wrap{padding:24px}</style>
</head>
<body class="sl-root">
<div id="root" class="wrap"></div>
<script>
  var S = window.Solari, h = React.createElement;
  var cols = [
    { key: 'time', label: 'Time', width: 5 },
    { key: 'to', label: 'Destination', width: 12 },
    { key: 'plat', label: 'Plat', width: 2, align: 'right' },
    { key: 'status', label: 'Remarks', width: 9 }
  ];
  var a = [
    { time: '09:42', to: 'Geneva', plat: '4', status: 'On time' },
    { time: '09:55', to: 'Milano C.le', plat: '11', status: { text: 'Delayed', color: 'yellow' } },
    { time: '10:08', to: 'Zurich HB', plat: '7', status: 'On time' },
    { time: '10:20', to: 'Paris Lyon', plat: '2', status: 'Boarding' }
  ];
  var b = [
    { time: '09:55', to: 'Milano C.le', plat: '11', status: { text: 'Boarding', color: 'yellow' } },
    { time: '10:08', to: 'Zurich HB', plat: '7', status: 'On time' },
    { time: '10:20', to: 'Paris Lyon', plat: '2', status: 'On time' },
    { time: '10:31', to: 'Venezia S.L.', plat: '9', status: 'On time' }
  ];
  function Demo() {
    var s = React.useState(false), flip = s[0], set = s[1];
    React.useEffect(function () { var t = setInterval(function () { set(function (x) { return !x; }); }, 7000); return function () { clearInterval(t); }; }, []);
    return h(S.DepartureBoard, { title: 'Departures', aside: h(S.StatusFlap, null, 'Live'), columns: cols, rows: flip ? b : a, rowCount: 4, size: 'md' });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
